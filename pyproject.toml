[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "36120-25sp-group6-at3-streamlit"
version = "0.1.0"
description = "Streamlit app displaying cryptocurrency data and ML predictions for group 6 AT3 project."
authors = [
    "Group6"
]
package-mode = false
readme = "README.md"

[tool.poetry.dependencies]
python = "==3.11.4"
streamlit = "1.50.0"
pandas = "2.2.2"
numpy = "^2.3.2"
requests = "*"
plotly = "^6.3.1"
